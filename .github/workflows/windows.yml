name: Windows client checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test connection lifecycle and Windows UI
        run: dotnet run --project tests/hsclient.Tests.csproj -c Release
      - name: Publish Windows client
        run: dotnet publish hsclient.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: hsclient-win-x64
          path: publish/hsclient.exe
